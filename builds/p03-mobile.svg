<svg xmlns="http://www.w3.org/2000/svg" width="480" height="236" viewBox="0 0 480 236" role="img" aria-label="GPlayDL-TUI — 8 stars, 2 forks, 1 pull requests, Python, MIT"><defs><linearGradient id="cBg" x1="0" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#111b26"/><stop offset="1" stop-color="#05070b"/></linearGradient>
