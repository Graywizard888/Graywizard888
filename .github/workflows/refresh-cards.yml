name: Refresh repo card stats

# Keeps every machine-knowable number on the cards current, the same way the 3D
# contribution city keeps itself current: the account numbers in the whoami
# banner and the dashboard (public repos, stars earned, contributions, gists),
# plus the per-repo stars, forks, PR counts, licences and "pushed N ago" labels.
# Runs on the default branch only (GitHub ignores `schedule` on other branches),
# so merge first, then it takes over by itself.
on:
  schedule: # 09:50 IST == 04:20 UTC - clear of the 3D city job at 19:00 UTC
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull live counts from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/profile-art/refresh_stats.py

      - name: Redraw the cards
        run: python3 tools/profile-art/build.py

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the root SVGs (hero, dashboard, phone variants) carry the account
          # numbers too, so stage every SVG at any depth
          git add '*.svg' tools/profile-art/builds.json README.md
          if git diff --cached --quiet; then
            echo "counts unchanged - nothing to commit"
          else
            git commit -m "Refresh repo card stats"
            git pull --rebase --autostash
            git push
          fi
